<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизация по Email</title>
  
  <!-- Аватарка / Иконка сайта -->
  <link rel="icon" type="image/jpeg" href="img.jpg">
  <link rel="shortcut icon" href="img.jpg" type="image/jpeg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #f8fafc;
    }

    /* Анимации */
    @keyframes cardAppear {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes stepFadeIn {
      0% {
        opacity: 0;
        transform: translateX(15px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    /* Контейнер карточки */
    .auth-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Аватарка */
    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 24px auto;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #3b82f6;
      box-shadow: 0 8px 24px rgba(59, 130, 246, 0.3);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-img:hover {
      transform: scale(1.08) rotate(3deg);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    /* Формы */
    .form-step {
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: stepFadeIn 0.4s ease-out forwards;
    }

    .hidden {
      display: none !important;
    }

    .input-group {
      position: relative;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid #334155;
      border-radius: 14px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      text-align: center;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    input#code-input {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 6px;
    }

    /* Кнопки */
    button.btn-primary {
      width: 100%;
      padding: 16px;
      background: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
    }

    button.btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    button.btn-primary:active {
      transform: translateY(0);
    }

    button.btn-primary.loading {
      animation: pulse 1.2s infinite ease-in-out;
      pointer-events: none;
      background: #1d4ed8;
      opacity: 0.8;
    }

    button.btn-secondary {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: color 0.2s ease;
    }

    button.btn-secondary:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* Ошибки и Уведомления */
    .alert-box {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: stepFadeIn 0.3s ease;
    }

    .alert-box.error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      animation: shake 0.4s ease;
    }

    .alert-box.success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <!-- Аватарка сайта -->
    <div class="avatar-wrapper">
      <img src="img.jpg" alt="Аватар" class="avatar-img" onerror="this.src='https://via.placeholder.com/96?text=LOGO'">
    </div>

    <h2>Вход в аккаунт</h2>
    <p class="subtitle" id="subtitle-text">Введите вашу почту, и мы отправим вам секретный код подтверждения</p>

    <!-- Шаг 1: Ввод Email -->
    <form id="email-form" class="form-step">
      <div class="input-group">
        <input type="email" id="email-input" placeholder="example@gmail.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn-primary" id="send-btn">Отправить код</button>
    </form>

    <!-- Шаг 2: Ввод Кода -->
    <form id="code-form" class="form-step hidden">
      <div class="input-group">
        <input type="text" id="code-input" placeholder="0000" maxlength="6" required autocomplete="one-time-code">
      </div>
      <button type="submit" class="btn-primary" id="verify-btn">Подтвердить вход</button>
      <button type="button" class="btn-secondary" id="back-btn">← Указать другую почту</button>
    </form>

    <!-- Сообщение об ошибке/успехе -->
    <div id="status-box" class="alert-box hidden"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const emailForm = document.getElementById('email-form');
      const codeForm = document.getElementById('code-form');
      const emailInput = document.getElementById('email-input');
      const codeInput = document.getElementById('code-input');
      const sendBtn = document.getElementById('send-btn');
      const verifyBtn = document.getElementById('verify-btn');
      const backBtn = document.getElementById('back-btn');
      const statusBox = document.getElementById('status-box');
      const subtitleText = document.getElementById('subtitle-text');

      let currentEmail = '';

      // 1. Отправка Email на сервер
      emailForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        setLoading(sendBtn, true, 'Отправка...');
        hideStatus();

        try {
          const response = await fetch('/api/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });

          const data = await response.json();

          if (response.ok) {
            currentEmail = email;
            emailForm.classList.add('hidden');
            codeForm.classList.remove('hidden');
            subtitleText.innerHTML = `Мы отправили 6-значный код на почту:<br><b style="color:#ffffff;">${email}</b>`;
            showStatus('Код успешно отправлен на почту!', 'success');
          } else {
            showStatus(data.message || 'Не удалось отправить код', 'error');
          }
        } catch (err) {
          showStatus('Ошибка подключения к серверу', 'error');
        } finally {
          setLoading(sendBtn, false, 'Отправить код');
        }
      });

      // 2. Проверка Введенного Кода
      codeForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = codeInput.value.trim();
        if (!code) return;

        setLoading(verifyBtn, true, 'Проверка...');
        hideStatus();

        try {
          const response = await fetch('/api/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentEmail, code })
          });

          const data = await response.json();

          if (response.ok) {
            showStatus('Успешный вход! Перенаправление...', 'success');
            setTimeout(() => {
              window.location.href = '/';
            }, 1500);
          } else {
            showStatus(data.message || 'Неверный код подтверждения', 'error');
          }
        } catch (err) {
          showStatus('Ошибка при проверке кода', 'error');
        } finally {
          setLoading(verifyBtn, false, 'Подтвердить вход');
        }
      });

      // Возврат к вводу email
      backBtn.addEventListener('click', () => {
        codeForm.classList.add('hidden');
        emailForm.classList.remove('hidden');
        subtitleText.textContent = 'Введите вашу почту, и мы отправим вам секретный код подтверждения';
        hideStatus();
      });

      function setLoading(btn, isLoading, text) {
        btn.textContent = text;
        btn.classList.toggle('loading', isLoading);
        btn.disabled = isLoading;
      }

      function showStatus(msg, type) {
        statusBox.textContent = msg;
        statusBox.className = `alert-box ${type}`;
        statusBox.classList.remove('hidden');
      }

      function hideStatus() {
        statusBox.textContent = '';
        statusBox.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
