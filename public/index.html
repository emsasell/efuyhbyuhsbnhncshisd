<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMIX METROSHOP</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --error: #ef4444;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1000px;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .site-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .site-avatar {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            object-fit: cover;
            border: 2px solid var(--accent);
        }

        .site-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar-letter {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            background-color: #475569;
        }

        main {
            width: 100%;
            max-width: 1000px;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            margin: 40px auto;
            padding: 24px;
            background-color: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { background-color: #475569; cursor: not-allowed; }

        .code-input-group {
            display: flex;
            gap: 8px;
        }

        .code-input-group input {
            letter-spacing: 4px;
            font-size: 1.2rem;
            text-align: center;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        .message {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            text-align: center;
            display: none;
        }

        .message.error { display: block; background-color: rgba(239, 68, 68, 0.15); color: var(--error); border: 1px solid var(--error); }
        .message.success { display: block; background-color: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid var(--success); }
    </style>
</head>
<body>

    <header>
        <div class="site-brand">
            <img src="img.png" alt="Logo" class="site-avatar" onerror="this.style.display='none'">
            <span class="site-title">TIMIX METROSHOP</span>
        </div>

        <div class="user-profile-badge">
            <div class="user-avatar-letter" id="headerAvatar">?</div>
            <div>
                <div id="headerUsername" style="font-weight: 600;">Гость</div>
                <div id="headerBalance" style="font-size: 0.8rem; color: var(--text-muted);">Баланс: 0 ₽</div>
            </div>
        </div>
    </header>

    <main>
        <div id="authSection" class="container">
            <h2 style="text-align:center; margin-bottom: 20px;">Авторизация Telegram</h2>
            <form onsubmit="handleAuth(event)">
                <div class="form-group">
                    <label>Юзернейм</label>
                    <input type="text" id="username" placeholder="Ваше имя..." required>
                </div>
                <div class="form-group">
                    <label>Telegram Chat ID</label>
                    <input type="text" id="chatId" placeholder="Ваш Chat ID..." required>
                </div>
                <div class="form-group">
                    <label>Код подтверждения</label>
                    <div class="code-input-group">
                        <input type="text" id="code" maxlength="6" placeholder="000000" required>
                        <button type="button" class="btn" style="width: auto; padding: 0 16px;" id="sendCodeBtn" onclick="requestCode()">Код</button>
                    </div>
                </div>
                <button type="submit" class="btn">Войти</button>
                <div id="statusMessage" class="message"></div>
            </form>
        </div>

        <div id="shopSection" style="display: none;">
            <h2>Каталог товаров (Metro Royale)</h2>
            <div id="productsGrid" class="products-grid"></div>
        </div>
    </main>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('user_session')) || null;

        window.onload = () => {
            if (currentUser) {
                renderProfile();
                showShop();
            }
        };

        function renderProfile() {
            if (!currentUser) return;
            const letter = currentUser.username.charAt(0).toUpperCase();
            const avatar = document.getElementById('headerAvatar');
            avatar.textContent = letter;
            avatar.style.backgroundColor = currentUser.avatarColor || '#3b82f6';
            document.getElementById('headerUsername').textContent = currentUser.username;
            document.getElementById('headerBalance').textContent = `Баланс: ${currentUser.balance} ₽`;
        }

        async function requestCode() {
            const username = document.getElementById('username').value.trim();
            const chatId = document.getElementById('chatId').value.trim();

            if (!username || !chatId) {
                showMessage('Заполните Юзернейм и Chat ID!', 'error');
                return;
            }

            try {
                const res = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, chatId })
                });
                const data = await res.json();
                showMessage(data.message, data.success ? 'success' : 'error');
            } catch (err) {
                showMessage('Ошибка отправки кода', 'error');
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const chatId = document.getElementById('chatId').value.trim();
            const code = document.getElementById('code').value.trim();

            try {
                const res = await fetch('/api/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, chatId, code })
                });
                const data = await res.json();

                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('user_session', JSON.stringify(currentUser));
                    renderProfile();
                    showShop();
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (err) {
                showMessage('Ошибка авторизации', 'error');
            }
        }

        async function showShop() {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('shopSection').style.display = 'block';

            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                const grid = document.getElementById('productsGrid');
                grid.innerHTML = '';

                data.products.forEach(p => {
                    grid.innerHTML += `
                        <div class="product-card">
                            <img src="${p.image_url}" class="product-img" onerror="this.src='img.png'">
                            <h3>${p.name}</h3>
                            <p style="color: var(--text-muted); font-size: 0.9rem;">${p.description}</p>
                            <div style="font-size: 1.2rem; font-weight: bold; color: var(--accent);">${p.price} ₽</div>
                            <button class="btn" onclick="alert('Товар добавлен в корзину!')">Купить</button>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Ошибка загрузки товаров', err);
            }
        }

        function showMessage(text, type) {
            const msgBox = document.getElementById('statusMessage');
            msgBox.textContent = text;
            msgBox.className = `message ${type}`;
        }
    </script>
</body>
</html>
